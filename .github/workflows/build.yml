name: Build & Release MapleEXP Tracker

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile Executable
      run: |
        python build_exe.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MapleEXPTracker-Windows
        path: dist/MapleEXPTracker.exe

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'MapleEXP Tracker v1.0.0' }}
        body: |
          ## 🍁 MapleEXP Tracker

          Download **`MapleEXPTracker.exe`** below to start tracking your EXP!

          ### 🚀 Quick Start
          1. Download `MapleEXPTracker.exe` from the **Assets** section below.
          2. Double-click to run (no installation or Python required).
          3. Launch MapleStory — the tracker will automatically detect and lock onto your EXP bar.

          ### ✨ Key Features
          - **Multi-Window & Multi-Scale**: Automatically adapts to any window resolution and UI scaling.
          - **Occlusion-Proof**: Windows Graphics Capture (WGC) tracks EXP even with other windows (Discord, web browser) in front.
          - **Rolling Windows**: Tracks EXP received and projected hourly rates for **1m, 5m, 10m, 30m, and 1h**.
          - **Always-on-Top & Live Preview**: Pinned overlay with real-time recognition verification.
        files: dist/MapleEXPTracker.exe
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
